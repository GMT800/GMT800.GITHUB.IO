<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأحجام</title>

<!-- نفس الخط -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    background: #111;
    color: white;
    text-align: center;
    font-family: 'Cairo', Tahoma, Arial;
    margin: 0;
}

/* زر الرجوع */
.back-btn {
    display: inline-block;
    margin: 20px;
    padding: 10px 20px;
    background: linear-gradient(90deg, #d60000 0%, #d4af37 100%);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.back-btn:hover {
    transform: scale(1.1);
}

/* العنوان */
h1 {
    margin-top: 30px;
}

p {
    color: #ccc;
}
</style>

</head>

<body>

<a href="index.html" class="back-btn">⬅ الرجوع</a>

<h1>أحجام 1500 / 2500 / 3500</h1>
<p>هنا بتحط كل التفاصيل لاحقًا</p>

</html>
