<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMT800</title>

<style>
body {
    margin: 0;
    font-family: "Tahoma", Arial;
    background: linear-gradient(to bottom, #111, #222);
    color: white;
    text-align: center;
}

/* الهيدر */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;

    background: linear-gradient(90deg, #d60000 0%, #d4af37 100%);
    position: relative; /* مهم */
}

/* نص اليسار */
header .left {
    color: white;
    text-shadow: 0 0 10px rgba(0,0,0,0.7);
}

/* نص اليمين */
header .right {
    color: white;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
}

/* GMT800 في النص */
header .center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);

    background: #111;
    color: #d4af37;
    padding: 6px 15px;
    border-radius: 10px;

    font-size: 14px;
    letter-spacing: 2px;

    box-shadow: 0 0 10px rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.2);
}

/* القسم الرئيسي */
.hero {
    padding: 80px 20px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.hero p {
    color: #ccc;
}

/* الكروت */
.cards {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 50px;
    flex-wrap: wrap;
}

/* الكرت */
.card {
    background: linear-gradient(145deg, #1c1c1c, #2a2a2a);
    padding: 30px;
    border-radius: 20px;
    width: 260px;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    cursor: pointer;
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
    background: linear-gradient(145deg, #2a2a2a, #3a3a3a);
}

/* عنوان الكرت */
.card h2 {
    margin-bottom: 10px;
}

/* وصف */
.card p {
    color: #bbb;
}
</style>
</head>

<body>

<header>
    <div class="left">CHEVROLET SILVERADO</div>

    <div class="center">GMT800</div>

    <div class="right">GMC SIERRA</div>
</header>

<section class="hero">
    <h1>كل ما تحتاج معرفته عن السييرا والسلفرادو</h1>
    <p>أحجام المكاين - أنواع القيور - أنواع الشاصي - أنواع الدفرنسات - أحجام الحوض - الألوان - المواصفات الداخلية - الأكسسوارات - الفئات</p>
</section>

<section class="cards">

    <div class="card">
        <h2>1500 / 2500 / 3500</h2>
        <p>الأحجام</p>
    </div>

    <div class="card">
        <h2>1999 - 2002</h2>
        <p>البداية</p>
    </div>

    <div class="card">
        <h2>2003 - 2007 (Classic)</h2>
        <p>الفيس ليفت</p>
    </div>

</section>

</body>
</html>
