<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMT800</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #111;
            color: white;
            text-align: center;
        }

        header {
            background: #000;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .hero {
            padding: 100px 20px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 50px;
        }

        .card {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            width: 250px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            background: #333;
        }
    </style>
</head>

<body>

<header>
    GMT800 GENERATION
</header>

<section class="hero">
    <h1>Welcome to GMT800</h1>
    <p>Everything about Sierra & Silverado 1999-2007</p>
</section>

<section class="cards">

    <div class="card">
        <h2>1999-2002</h2>
        <p>Before Facelift</p>
    </div>

    <div class="card">
        <h2>2003-2007 Classic</h2>
        <p>After Facelift</p>
    </div>

    <div class="card">
        <h2>1500 / 2500 / 3500</h2>
        <p>Truck Categories</p>
    </div>

</section>

</body>
</html>
