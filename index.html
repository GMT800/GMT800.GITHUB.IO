<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMT800</title>

<style>
body {
    margin: 0;
    font-family: "Tahoma", Arial;
    background: linear-gradient(to bottom, #111, #222);
    color: white;
    text-align: center;
}

/* الهيدر */
header {
    background: linear-gradient(to right, #000, #333);
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* القسم الرئيسي */
.hero {
    padding: 80px 20px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.hero p {
    color: #ccc;
}

/* الكروت */
.cards {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 50px;
    flex-wrap: wrap;
}

/* الكرت */
.card {
    background: linear-gradient(145deg, #1c1c1c, #2a2a2a);
    padding: 30px;
    border-radius: 20px;
    width: 260px;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    cursor: pointer;
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
    background: linear-gradient(145deg, #2a2a2a, #3a3a3a);
}

/* عنوان الكرت */
.card h2 {
    margin-bottom: 10px;
}

/* وصف */
.card p {
    color: #bbb;
}
</style>
</head>

<body>

<header>
    GMC SIERRA / CHEVROLET SILVERADO (GMT800)
</header>

<section class="hero">
    <h1>كل ما تحتاج معرفته عن السييرا والسلفرادو  </h1>
    <p>1999 - 2007</p>
</section>

<section class="cards">

    <!-- يسار -->
    <div class="card">
        <h2>2003 - 2007 Classic</h2>
        <p>بعد التحديث (Cat Eye)</p>
    </div>

    <!-- الوسط -->
    <div class="card">
        <h2>1999 - 2002</h2>
        <p>قبل التحديث</p>
    </div>

    <!-- يمين -->
    <div class="card">
        <h2>1500 / 2500 / 3500</h2>
        <p>فئات الشاحنات</p>
    </div>

</section>

</body>
</html>
